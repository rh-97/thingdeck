name: thingdeck

# All Node tooling runs inside containers; nothing is installed on the host.
# node_modules lives in a named volume so host and container never share it.
services:
  app:
    build:
      context: .
      target: dev
    image: thingdeck-dev
    ports:
      - '127.0.0.1:${THINGDECK_PORT:-5180}:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Docker Desktop bind mounts can miss fs events; polling keeps HMR reliable.
      - VITE_USE_POLLING=${VITE_USE_POLLING:-true}

  e2e:
    profiles: ['e2e']
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    depends_on: [app]
    environment:
      - BASE_URL=http://app:5173
      - CI=1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ipc: host

  prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    image: thingdeck
    ports:
      - '127.0.0.1:${THINGDECK_PROD_PORT:-8080}:8080'

volumes:
  node_modules:
