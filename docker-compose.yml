name: thingsdeck

# Ports bind to 127.0.0.1 unless THINGSDECK_BIND is set (e.g. 0.0.0.0 in .env to share on your LAN).
# All Node tooling runs inside containers; nothing is installed on the host.
# node_modules lives in a named volume so host and container never share it.
services:
  app:
    build:
      context: .
      target: dev
    image: thingsdeck-dev
    ports:
      - '${THINGSDECK_BIND:-127.0.0.1}:${THINGSDECK_PORT:-5180}:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on: [server]
    environment:
      # Docker Desktop bind mounts can miss fs events; polling keeps HMR reliable.
      - VITE_USE_POLLING=${VITE_USE_POLLING:-true}
      - VITE_API_TARGET=http://server:3000

  # Account/session API for `make dev`, restarted automatically when server/ changes.
  server:
    image: thingsdeck-dev
    command: ['node', '--watch-path=server', 'server/start.ts']
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - dev_data:/data
      - ./certs:/certs:ro
    environment:
      - DATA_DIR=/data
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - THINGSDECK_SECRET=${THINGSDECK_SECRET:-}
      - THINGSDECK_SIGNUP=${THINGSDECK_SIGNUP:-open}

  e2e:
    profiles: ['e2e']
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    depends_on: [app]
    # Share the dev server's network namespace: Chromium only allows plain HTTP for localhost.
    network_mode: service:app
    environment:
      - BASE_URL=http://localhost:5173
      - CI=1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ipc: host

  prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    image: thingsdeck
    depends_on: [api]
    restart: unless-stopped
    ports:
      - '${THINGSDECK_BIND:-127.0.0.1}:${THINGSDECK_PROD_PORT:-8080}:8080'

  # Production account/session API (not exposed; nginx forwards /api to it).
  api:
    profiles: ['prod']
    build:
      context: .
      target: server
    image: thingsdeck-server
    restart: unless-stopped
    volumes:
      - data:/data
      # Optional company CA certificates (binary or text) for HTTPS-inspecting networks.
      - ./certs:/certs:ro
    environment:
      - THINGSDECK_SECRET=${THINGSDECK_SECRET:-}
      - THINGSDECK_SIGNUP=${THINGSDECK_SIGNUP:-open}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}

volumes:
  node_modules:
  # Accounts, sessions and encrypted tokens. Back these up.
  data:
  dev_data:
